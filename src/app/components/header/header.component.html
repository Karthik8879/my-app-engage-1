<header class="header">
  @if (showShare()) {
    <button type="button" class="icon-btn" (click)="onShare()" aria-label="Share">
      <img src="/ShareIcon.svg" alt="" width="20" height="20" />
    </button>
  }
  @if (showInfo()) {
    <button type="button" class="icon-btn" (click)="onInfo()" aria-label="Info">
      <img src="/InfoIcon.svg" alt="" width="20" height="20" />
    </button>
  }
</header>
